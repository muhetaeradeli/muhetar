name: GTA6 PC 版追踪

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时一次（UTC）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gta6-pc-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gta6-pc-tracker/fetch.py
      - name: 提交新数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta6-pc-tracker/data.json
          git diff --cached --quiet || (git commit -m "更新 GTA6 PC 版追踪数据" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gta6-pc-tracker/site
      - id: deploy
        uses: actions/deploy-pages@v4
